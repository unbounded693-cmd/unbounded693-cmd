<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Link Video Responsif</title>
    <style>
        /* --- KODE CSS RESPONSIF --- */
        
        body {
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
            font-family: sans-serif;
        }

        /* Sistem Grid untuk mengatur baris dan kolom secara otomatis */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px; 
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Mengubah tag <a> menjadi berbentuk tombol/kotak kartu yang rapi */
        .video-link {
            display: block;
            background: #ffffff;
            color: #333333;
            text-decoration: none; /* Menghilangkan garis bawah link default */
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            border: 1px solid #dddddd;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        /* Efek interaktif saat link disentuh kursor (hover) */
        .video-link:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
            background-color: #fdfdfd;
            border-color: #007bff;
            color: #007bff;
        }

        /* Gaya ikon pemutar video buatan (opsional untuk pemanis) */
        .play-icon {
            font-size: 40px;
            margin-bottom: 10px;
            display: block;
        }
    </style>
</head>
<body>

    <!-- --- GALERI LINK VIDEO --- -->
    <div class="video-grid">

        <!-- Link Video 1 -->
        <a href="video1.mp4" class="video-link" target="_blank">
            <span class="play-icon">▶️</span>
            <strong>Tonton Video Pertama</strong>
        </a>

        <!-- Link Video 2 -->
        <a href="video2.mp4" class="video-link" target="_blank">
            <span class="play-icon">▶️</span>
            <strong>Tonton Video Kedua</strong>
        </a>

        <!-- Link Video 3 -->
        <a href="video3.mp4" class="video-link" target="_blank">
            <span class="play-icon">▶️</span>
            <strong>Tonton Video Ketiga</strong>
        </a>

        <!-- Anda tinggal menambah blok <a href="...">...</a> lagi di bawah ini -->

    </div>

</body>
</html>
